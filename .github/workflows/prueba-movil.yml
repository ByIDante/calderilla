name: Prueba en el móvil

# Publica la prueba de la fase 0 en Cloudflare Pages, en su propia dirección (rama «prueba»), para abrirla en los
# móviles. No toca la versión de los ordenadores.
on:
  push:
    branches: [spike/movil]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node spike/construir.ts
      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.157.0 pages project create calderilla --production-branch=main || true
          npx --yes wrangler@4.157.0 pages deploy dist-prueba --project-name=calderilla --branch=prueba | tee publicar.log
          # Si el nombre ya estaba cogido, Cloudflare le añade unas letras: la dirección de verdad sale en el aviso
          direccion=$(grep -oE 'https://prueba\.[a-z0-9-]+\.pages\.dev' publicar.log | head -n 1)
          echo "::notice title=Dirección de la prueba::${direccion:-no salió en la salida de wrangler}"
          echo "Dirección de la prueba: ${direccion:-no salió en la salida de wrangler}" >> "$GITHUB_STEP_SUMMARY"
