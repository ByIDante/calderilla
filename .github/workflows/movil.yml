name: App del móvil

# Cuando la Comprobación pasa en main: construye la app del móvil, la prueba en un Chrome como de móvil (con un
# Google Drive falso) y la publica en Cloudflare Pages (https://calderilla-app.pages.dev). Los ordenadores no se
# enteran: siguen actualizándose desde main como siempre.
on:
  workflow_run:
    workflows: [Comprobación]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: movil
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # La misma versión que acaba de pasar la Comprobación
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Probar en un Chrome como de móvil
        run: npm run movil:probar
      - name: Construir la versión que se publica
        run: node scripts/movil/construir.ts "$(date -u +%Y%m%d%H%M)-$(git rev-parse --short HEAD)"
      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.157.0 pages deploy dist-movil --project-name=calderilla-app --branch=main --commit-dirty=true
