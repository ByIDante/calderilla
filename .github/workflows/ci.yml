name: Comprobación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  comprobar:
    # Windows además de Linux: es donde se usa la app en el otro ordenador
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
